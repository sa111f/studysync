# ── Dev profile ────────────────────────────────────────────────────────────────
# Activated by: SPRING_PROFILES_ACTIVE=dev  (set in IDE run config or terminal)

# ── Local PostgreSQL ────────────────────────────────────────────────────────────
spring.datasource.url=jdbc:postgresql://localhost:5432/studysyncer
spring.datasource.username=postgres
spring.datasource.password=1234
spring.datasource.driver-class-name=org.postgresql.Driver
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect

# ── Debug logging ───────────────────────────────────────────────────────────────
logging.level.StudySyncer=DEBUG
logging.level.org.hibernate.SQL=DEBUG
spring.jpa.properties.hibernate.format_sql=true

# ── Dev tools ───────────────────────────────────────────────────────────────────
# Set to true to wipe all users + sessions on every restart.
app.dev.reset-on-start=false

# Disable DevTools auto-restart — it clears all in-memory sessions (logs users out).
# Without this, saving a file in the IDE can silently log out the currently logged-in user.
spring.devtools.restart.enabled=false
