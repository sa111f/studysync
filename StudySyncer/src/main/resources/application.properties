spring.application.name=StudySyncer

# ── Shared settings (profile-independent) ─────────────────────────────────────
# Datasource driver, dialect, and URL live in application-dev.properties
# and application-prod.properties respectively.

spring.jpa.hibernate.ddl-auto=update

# Railway injects PORT; falls back to 8080 locally.
server.port=${PORT:8080}

# ── Session persistence ────────────────────────────────────────────────────────
# Keep users logged in for 7 days of inactivity (default is 30 minutes).
server.servlet.session.timeout=7d
# httpOnly=true prevents JS access to the session cookie (XSS protection).
server.servlet.session.cookie.http-only=true
# SameSite=Lax prevents the cookie being dropped on cross-site navigations
# (e.g. coming back from Google OAuth redirect). Strict breaks OAuth2 redirects.
server.servlet.session.cookie.same-site=Lax

# ── Anthropic Claude (AI task parser — Phase 5) ────────────────────────────────
# ANTHROPIC_API_KEY is optional. When blank, AiTaskParserService short-circuits
# to AI_UNAVAILABLE and the /api/ai/parse-task endpoint returns 503. App still
# boots normally and the "Add with AI" button surfaces a clear fallback state.
anthropic.api.key=${ANTHROPIC_API_KEY:}
anthropic.api.url=https://api.anthropic.com/v1/messages
anthropic.api.model=claude-haiku-4-5-20251001
anthropic.api.timeout-seconds=15

# ── Logging (production default; dev profile overrides to DEBUG) ───────────────
logging.level.StudySyncer=INFO

# ── Google OAuth2 ──────────────────────────────────────────────────────────────
# Set GOOGLE_CLIENT_ID and GOOGLE_CLIENT_SECRET as environment variables.
# When both are blank (not configured), GoogleOAuthConfig provides a safe empty
# ClientRegistrationRepository so the app starts without crashing.
# The /auth/google-start gateway redirects to /?error=oauth if not configured.
spring.security.oauth2.client.registration.google.client-id=${GOOGLE_CLIENT_ID:}
spring.security.oauth2.client.registration.google.client-secret=${GOOGLE_CLIENT_SECRET:}
spring.security.oauth2.client.registration.google.scope=openid,profile,email
spring.security.oauth2.client.registration.google.redirect-uri=https://www.studysyncer.com/login/oauth2/code/google

# ── Resend email (accountability notifications) ────────────────────────────────
# Set these as environment variables — never hardcode credentials.
resend.api-key=${RESEND_API_KEY:}
resend.from-email=${APP_FROM_EMAIL:}
resend.alert-to-email=${ALERT_TO_EMAIL:}

# ── Twilio (no longer used for accountability — kept to avoid startup errors) ──
twilio.account-sid=${TWILIO_ACCOUNT_SID:}
twilio.auth-token=${TWILIO_AUTH_TOKEN:}
twilio.phone-number=${TWILIO_PHONE_NUMBER:}
# ── Daily goal accountability scheduler ────────────────────────────────────────
# Cron: second minute hour day-of-month month day-of-week
# Default: run every day at 23:59:00 server time.
studysyncer.notification.cron=${NOTIFICATION_CRON:0 59 23 * * *}
# Timezone for the scheduler — set to match your local timezone.
studysyncer.notification.timezone=${NOTIFICATION_TIMEZONE:America/New_York}
