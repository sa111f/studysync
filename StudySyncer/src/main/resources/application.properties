spring.application.name=StudySyncer

# ── Active profile ─────────────────────────────────────────────────────────────
# "dev" enables /dev/admin and optional data-reset on startup.
# Remove this line (or override via env var SPRING_PROFILES_ACTIVE=prod) before deploying.
spring.profiles.active=dev

# ── PostgreSQL ─────────────────────────────────────────────────────────────────
# Database 'studysyncer' must already exist in PostgreSQL (created via pgAdmin).
# To use a different password, change spring.datasource.password here.
spring.datasource.url=jdbc:postgresql://localhost:5432/studysyncer
spring.datasource.driver-class-name=org.postgresql.Driver
spring.datasource.username=postgres
spring.datasource.password=1234
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect

# update  = add new tables/columns on startup, never drop anything (good for dev)
# validate = check schema matches entities but make no changes (use before prod)
# create  = drop and recreate all tables every restart (wipes data — use with caution)
spring.jpa.hibernate.ddl-auto=update

# ── File uploads ──────────────────────────────────────────────────────────────
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB

# ── OpenAI (optional — leave blank to use rule-based fallback) ────────────────
studysyncer.ai.api-key=${OPENAI_API_KEY:}
studysyncer.ai.model=gpt-4o-mini

# ── Logging ───────────────────────────────────────────────────────────────────
# Shows [SIGNUP] / [LOGIN] debug lines and formatted SQL on every query.
# Lower StudySyncer to INFO and remove the hibernate lines once confirmed working.
logging.level.StudySyncer=DEBUG
logging.level.org.hibernate.SQL=DEBUG
spring.jpa.properties.hibernate.format_sql=true
