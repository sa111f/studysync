spring.application.name=StudySyncer

# ── Shared settings (profile-independent) ─────────────────────────────────────
# Datasource driver, dialect, and URL live in application-dev.properties
# and application-prod.properties respectively.

spring.jpa.hibernate.ddl-auto=update

# Railway injects PORT; falls back to 8080 locally.
server.port=${PORT:8080}

# ── File uploads ───────────────────────────────────────────────────────────────
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB

# ── OpenAI ─────────────────────────────────────────────────────────────────────
studysyncer.ai.model=gpt-4o-mini
studysyncer.ai.api-key=${OPENAI_API_KEY:}

# ── Logging (production default; dev profile overrides to DEBUG) ───────────────
logging.level.StudySyncer=INFO

# ── Google OAuth2 ──────────────────────────────────────────────────────────────
# These properties must NOT be set with empty defaults.
# Spring Boot validates client-id at startup and throws if it is blank —
# crashing the app before Tomcat binds to its port.
#
# To enable Google sign-in, add the following as Railway environment variables
# (or in application-prod.properties once you have real credentials):
#
#   spring.security.oauth2.client.registration.google.client-id=YOUR_CLIENT_ID
#   spring.security.oauth2.client.registration.google.client-secret=YOUR_CLIENT_SECRET
#   spring.security.oauth2.client.registration.google.scope=openid,profile,email
#
# SecurityConfig.java already handles the case where these are absent —
# it skips oauth2Login entirely, so the rest of the app works without them.
