# ── Prod profile ───────────────────────────────────────────────────────────────
# Activated by: -Dspring.profiles.active=prod  (hardcoded in railway.toml)
#
# Datasource resolution order:
#   1. DATABASE_URL (Railway provides this automatically for linked Postgres plugins)
#   2. Individual PG* vars constructed into a JDBC URL (fallback / older Railway format)
#
# Safe fallback defaults prevent a crash when a single var is temporarily absent;
# the DB check in StudySyncerApplication will still fail fast if the DB is unreachable.

spring.datasource.url=${DATABASE_URL:jdbc:postgresql://${PGHOST:localhost}:${PGPORT:5432}/${PGDATABASE:studysync}}
spring.datasource.username=${PGUSER:postgres}
spring.datasource.password=${PGPASSWORD:}
spring.datasource.driver-class-name=org.postgresql.Driver

spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect

# ── HikariCP connection pool ───────────────────────────────────────────────────
# Fail fast if the DB is unreachable (10 s) instead of hanging until Railway's
# healthcheck timeout fires.  Keep the pool small — Railway's free tier is limited.
spring.datasource.hikari.connection-timeout=10000
spring.datasource.hikari.maximum-pool-size=5
