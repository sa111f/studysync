# ── Prod profile ───────────────────────────────────────────────────────────────
# Activated by: -Dspring.profiles.active=prod  (hardcoded in railway.toml)
# Railway's PostgreSQL plugin injects all five PG* variables automatically.
# No defaults: missing variables cause an immediate startup failure (fail fast).

spring.datasource.url=jdbc:postgresql://${PGHOST}:${PGPORT}/${PGDATABASE}
spring.datasource.username=${PGUSER}
spring.datasource.password=${PGPASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
