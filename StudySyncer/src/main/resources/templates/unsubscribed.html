<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Unsubscribed — StudySyncer</title>
    <meta name="robots" content="noindex" />
    <link rel="icon" href="/favicon.ico" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" />
    <link rel="stylesheet" th:href="@{/css/style.css}" />
    <link rel="stylesheet" th:href="@{/css/ds.css}" />
</head>
<body>

<header>
    <div class="nav-inner">
        <a href="/" class="nav-logo-link"><span class="logo-study">Study</span><span class="logo-sync">Syncer</span></a>
    </div>
</header>

<main class="unsubscribed-page">
    <div class="unsubscribed-card">
        <div class="unsubscribed-check" aria-hidden="true">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"
                 stroke-linecap="round" stroke-linejoin="round">
                <circle cx="12" cy="12" r="10"/>
                <polyline points="8 12 11 15 16 9"/>
            </svg>
        </div>
        <h1 class="unsubscribed-title">You're unsubscribed.</h1>
        <p class="unsubscribed-sub">
            You won't receive any more <strong th:text="${emailTypeLabel} ?: 'notification'">notification</strong>
            emails from StudySyncer.
        </p>
        <p class="unsubscribed-sub">
            Changed your mind? You can re-enable any email type from your settings.
        </p>
        <div class="unsubscribed-actions">
            <a href="/" class="save-btn shine-btn">Manage all email notifications</a>
        </div>
    </div>
</main>

<footer class="site-footer">
    <span>© 2026 StudySyncer</span>
    <div class="site-footer-links">
        <a href="/privacy">Privacy</a>
        <span class="site-footer-sep">·</span>
        <a href="/terms">Terms</a>
        <span class="site-footer-sep">·</span>
        <a href="/about">About</a>
    </div>
</footer>

</body>
</html>
