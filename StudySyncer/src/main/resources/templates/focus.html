<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Focus Mode — StudySync</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;600;700&display=swap" rel="stylesheet" />
    <link rel="stylesheet" th:href="@{/css/focus.css}" />
</head>
<body>

<!-- ── Minimal top bar ──────────────────────────────────────────── -->
<div class="focus-topbar">
    <a href="/" class="focus-back-btn">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor"
             stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <polyline points="15 18 9 12 15 6"/>
        </svg>
        Dashboard
    </a>
    <span class="focus-page-title">Focus Mode</span>
    <span class="focus-spacer" aria-hidden="true"></span>
</div>

<!-- ── Main focus area ──────────────────────────────────────────── -->
<main class="focus-main">

    <!-- Phase tabs -->
    <div class="focus-phase-tabs" role="tablist" aria-label="Timer phase">
        <button class="focus-tab active" id="ftab-pomodoro"
                role="tab" aria-selected="true"
                onclick="setPhase('pomodoro')">Pomodoro</button>
        <button class="focus-tab" id="ftab-shortbreak"
                role="tab" aria-selected="false"
                onclick="setPhase('shortbreak')">Short Break</button>
        <button class="focus-tab" id="ftab-longbreak"
                role="tab" aria-selected="false"
                onclick="setPhase('longbreak')">Long Break</button>
    </div>

    <!-- ══════════════════════════════════════════════════════════════
         FINJAN — Arabic qahwa cup silhouette.

         Shape: wide flared rim (196 px, x=52–248) with a gentle outward
         curve near the top, rounding into a tapered body that narrows to
         a 92 px base (x=104–196) at y≈204.  Stocky and wide — not glassy.

         Fill mechanism (pixel-based):
           focus.js generates a grid of small purple <rect> pixels inside
           the interior clip region.  Each tick it shows the bottom N pixels
           where N = ceil(progress × totalPixels).
           As time drains, pixels disappear from the top first.

         ViewBox 0 0 300 270  |  CSS height: 420 px
         Inner clip top y=62, inner clip bottom ≈ y=214
         Click → fullscreen toggle (wired in focus.js)
         ══════════════════════════════════════════════════════════════ -->
    <div class="finjan-scene" id="finjan-scene">

        <svg id="finjan-svg"
             viewBox="0 0 300 270"
             xmlns="http://www.w3.org/2000/svg"
             role="button"
             tabindex="0"
             aria-label="Focus timer — click to toggle fullscreen">

            <defs>

                <!--
                    Interior clip — inner ceramic wall, ~14 px inside the
                    outer body on each side.  All pixel rects are masked here.
                    Top y=62 (flat), bottom arc peaks near y=207.
                -->
                <clipPath id="fj-clip">
                    <path d="M 68,62 L 232,62
                             C 248,86  232,162  188,200
                             Q 150,214  112,200
                             C  52,162  52, 86  68, 62 Z"/>
                </clipPath>

                <!--
                    Ceramic body gradient — horizontal, bright centre,
                    shaded edges to give the cup a rounded, three-dimensional
                    feel without looking flat or boring.
                -->
                <linearGradient id="fj-ceramic" x1="0" y1="0" x2="1" y2="0">
                    <stop offset="0%"   stop-color="#a898e8"/>
                    <stop offset="12%"  stop-color="#d8d0ff"/>
                    <stop offset="30%"  stop-color="#f0ecff"/>
                    <stop offset="50%"  stop-color="#ffffff"/>
                    <stop offset="70%"  stop-color="#f0ecff"/>
                    <stop offset="88%"  stop-color="#d8d0ff"/>
                    <stop offset="100%" stop-color="#a898e8"/>
                </linearGradient>

                <!--
                    Soft glow filter applied to the pixel group — gives each
                    small square a subtle purple bloom without being noisy.
                -->
                <filter id="fj-px-glow"
                        x="-25%" y="-25%" width="150%" height="150%"
                        color-interpolation-filters="sRGB">
                    <feGaussianBlur in="SourceGraphic" stdDeviation="1.8" result="blur"/>
                    <feMerge>
                        <feMergeNode in="blur"/>
                        <feMergeNode in="SourceGraphic"/>
                    </feMerge>
                </filter>

            </defs>

            <!--
                Outer cup body — Arabic finjan silhouette.

                Rim:  y=46, x=52–248  → 196 px wide
                The right side curve C(265,75)(248,165) creates a very slight
                outward flare near the top (the classic finjan shoulder), then
                sweeps strongly inward to the base at (196,204).
                Base arc: Q 150,222 → 104,204  (92 px span, wide rounded base)
                Height rim→base arc ≈ 176 px.  Aspect ≈ 196 × 176 — stocky.
            -->
            <path id="fj-body"
                  d="M 52,46 L 248,46
                     C 265,75  248,165  196,204
                     Q 150,222  104,204
                     C  52,165  35, 75  52, 46 Z"
                  fill="url(#fj-ceramic)"
                  stroke="rgba(175,155,255,0.55)"
                  stroke-width="1.5"/>

            <!-- ══ Interior — clipped to inner wall ══ -->
            <g clip-path="url(#fj-clip)">

                <!-- Deep dark empty-cup background -->
                <rect x="0" y="0" width="300" height="270" fill="#06031a"/>

                <!-- Purple pixel fill — populated and driven by focus.js -->
                <g id="fj-pixels" filter="url(#fj-px-glow)"></g>

            </g>

            <!--
                Ceramic rim band — the thick lip between the outer rim (y=46)
                and the interior opening (y=62).  Gives a sense of wall depth.
            -->
            <path d="M 52,46 L 248,46 L 232,62 Q 150,68 68,62 Z"
                  fill="rgba(200,185,255,0.10)"
                  stroke="rgba(200,180,255,0.28)"
                  stroke-width="0.9"/>

            <!-- Rim top highlight line -->
            <line x1="52" y1="46" x2="248" y2="46"
                  stroke="#e0d8ff" stroke-width="2.2" opacity="0.55"
                  stroke-linecap="round"/>

            <!-- Foot ring at the base — grounds the silhouette -->
            <ellipse cx="150" cy="215" rx="44" ry="5.5"
                     fill="url(#fj-ceramic)"
                     stroke="rgba(175,155,255,0.35)"
                     stroke-width="1.3"/>

            <!-- Subtle gloss on left inner wall — very faint -->
            <path d="M 74,70 C 70,106 68,154 72,188"
                  fill="none" stroke="rgba(255,255,255,0.038)"
                  stroke-width="12" stroke-linecap="round"/>

        </svg>

    </div><!-- /finjan-scene -->

    <!-- Timer countdown — sits directly below the cup -->
    <p class="finjan-time-display" id="finjan-time">25:00</p>

    <!-- Progress bar -->
    <div class="focus-bar-track" role="progressbar" aria-label="Session progress">
        <div class="focus-bar-fill" id="focus-bar-fill"></div>
    </div>

    <!-- Phase / session label -->
    <p class="focus-session-label" id="focus-session-label">Session 1 of 4</p>

    <!-- Controls -->
    <div class="focus-controls">
        <button class="focus-btn focus-btn-secondary" onclick="skipPhase()" title="Skip this phase">
            <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor"
                 stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                <polygon points="5 4 15 12 5 20 5 4"/>
                <line x1="19" y1="5" x2="19" y2="19"/>
            </svg>
            Skip
        </button>
        <button class="focus-btn focus-btn-primary" id="focus-toggle-btn" onclick="toggleTimer()">
            Start
        </button>
    </div>

    <!-- Keyboard hint -->
    <p class="focus-keyboard-hint">
        Press <kbd>Space</kbd> to pause&nbsp;/&nbsp;resume
    </p>

</main>

<!-- timer-core.js MUST load before focus.js -->
<script th:src="@{/js/timer-core.js}"></script>
<script th:src="@{/js/focus.js}"></script>
</body>
</html>
