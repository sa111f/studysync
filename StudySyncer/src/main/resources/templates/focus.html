<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Focus Mode — StudySync</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;600;700&display=swap" rel="stylesheet" />
    <link rel="stylesheet" th:href="@{/css/focus.css}" />
</head>
<body>

<!-- ── Minimal top bar ──────────────────────────────────────────── -->
<div class="focus-topbar">
    <a href="/" class="focus-back-btn">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor"
             stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <polyline points="15 18 9 12 15 6"/>
        </svg>
        Dashboard
    </a>
    <span class="focus-page-title">Focus Mode</span>
    <span class="focus-spacer" aria-hidden="true"></span>
</div>

<!-- ── Main focus area ──────────────────────────────────────────── -->
<main class="focus-main">

    <!-- Phase tabs -->
    <div class="focus-phase-tabs" role="tablist" aria-label="Timer phase">
        <button class="focus-tab active" id="ftab-pomodoro"
                role="tab" aria-selected="true"
                onclick="setPhase('pomodoro')">Pomodoro</button>
        <button class="focus-tab" id="ftab-shortbreak"
                role="tab" aria-selected="false"
                onclick="setPhase('shortbreak')">Short Break</button>
        <button class="focus-tab" id="ftab-longbreak"
                role="tab" aria-selected="false"
                onclick="setPhase('longbreak')">Long Break</button>
    </div>

    <!-- ══════════════════════════════════════════════════════════════
         FINJAN — Arabic qahwa cup, pixel-art inspired.

         Shape:  204 px wide rim (x=48–252) with a distinct outward flare
         (CP x=268) creating the authentic Arabic shoulder, then a strong
         inward sweep to a 52 px base span at y≈205.
         Height rim → bottom arc ≈ 172 px.  Aspect ≈ 1.19 : 1 — wide and
         stocky, matching an Arabic finjan front view.

         Cup border: white 3×3 pixel squares generated in focus.js, snapped
         to a 4 px grid, tracing the outer silhouette + inner rim opening.
         Placed in #fj-border-pixels (outside the interior clip).

         Fill: 4×4 purple micro-pixel <rect> elements inside the interior
         clip region, driven by timer progress.  Bottom pixels always show
         first; top pixels vanish as time runs out.

         ViewBox 0 0 300 270  |  CSS height: 420 px
         Click → fullscreen toggle (wired in focus.js)
         ══════════════════════════════════════════════════════════════ -->
    <div class="finjan-scene" id="finjan-scene">

        <svg id="finjan-svg"
             viewBox="0 0 300 270"
             xmlns="http://www.w3.org/2000/svg"
             role="button"
             tabindex="0"
             aria-label="Focus timer — click to toggle fullscreen">

            <defs>

                <!--
                    Interior clip — inner ceramic wall, ~14 px inside the
                    outer body.  Purple fill pixels are masked to stay here.
                    Top y=62 (flat), bottom arc peaks near y=212.
                -->
                <clipPath id="fj-clip">
                    <path d="M 62,62 L 238,62
                             C 252,88  228,162  166,198
                             Q 150,212  134,198
                             C  72,162   48, 88   62, 62 Z"/>
                </clipPath>

                <!--
                    Soft purple glow — applied to the inner pixel group only.
                    Keeps a controlled bloom without bleeding onto the white
                    border pixels.
                -->
                <filter id="fj-px-glow"
                        x="-25%" y="-25%" width="150%" height="150%"
                        color-interpolation-filters="sRGB">
                    <feGaussianBlur in="SourceGraphic" stdDeviation="1.4" result="blur"/>
                    <feMerge>
                        <feMergeNode in="blur"/>
                        <feMergeNode in="SourceGraphic"/>
                    </feMerge>
                </filter>

            </defs>

            <!--
                Cup body shell — almost-transparent fill so the ceramic wall
                area reads as subtly solid against the dark background.
                The visible border is entirely white pixel squares generated
                by focus.js and placed in #fj-border-pixels.

                Outer silhouette:
                  Rim  y=48, x=48–252  →  204 px wide
                  Right: C(268,70)(242,162) → (176,205)   strong outward shoulder
                  Base Q: 150,220 → (124,205)              52 px wide base
                  Left: mirror of right (symmetric around x=150)
            -->
            <path id="fj-body"
                  d="M 48,48 L 252,48
                     C 268,70  242,162  176,205
                     Q 150,220  124,205
                     C  58,162   32, 70   48, 48 Z"
                  fill="rgba(255,255,255,0.022)"
                  stroke="none"/>

            <!-- ── Interior — clipped to inner ceramic wall ── -->
            <g clip-path="url(#fj-clip)">
                <!-- Deep dark empty-cup background -->
                <rect x="0" y="0" width="300" height="270" fill="#06031a"/>
                <!-- Purple micro-pixel fill — built and driven by focus.js -->
                <g id="fj-pixels" filter="url(#fj-px-glow)"></g>
            </g>

            <!--
                White pixel border — focus.js samples the outer silhouette
                and inner rim line, snaps points to a 4 px grid, and renders
                3×3 white squares here.  This group sits on top of the clip
                so the border is always fully visible.
            -->
            <g id="fj-border-pixels"></g>

            <!-- Foot ring — very subtle arc grounding the base -->
            <ellipse cx="150" cy="213" rx="36" ry="4"
                     fill="none"
                     stroke="rgba(200,185,255,0.15)"
                     stroke-width="1.1"/>

            <!-- Left inner-wall gloss — barely visible depth hint -->
            <path d="M 68,70 C 64,106 62,158 66,190"
                  fill="none"
                  stroke="rgba(255,255,255,0.030)"
                  stroke-width="12"
                  stroke-linecap="round"/>

        </svg>

    </div><!-- /finjan-scene -->

    <!-- Timer countdown — sits directly below the cup -->
    <p class="finjan-time-display" id="finjan-time">25:00</p>

    <!-- Progress bar -->
    <div class="focus-bar-track" role="progressbar" aria-label="Session progress">
        <div class="focus-bar-fill" id="focus-bar-fill"></div>
    </div>

    <!-- Phase / session label -->
    <p class="focus-session-label" id="focus-session-label">Session 1 of 4</p>

    <!-- Controls -->
    <div class="focus-controls">
        <button class="focus-btn focus-btn-secondary" onclick="skipPhase()" title="Skip this phase">
            <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor"
                 stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                <polygon points="5 4 15 12 5 20 5 4"/>
                <line x1="19" y1="5" x2="19" y2="19"/>
            </svg>
            Skip
        </button>
        <button class="focus-btn focus-btn-primary" id="focus-toggle-btn" onclick="toggleTimer()">
            Start
        </button>
    </div>

    <!-- Keyboard hint -->
    <p class="focus-keyboard-hint">
        Press <kbd>Space</kbd> to pause&nbsp;/&nbsp;resume
    </p>

</main>

<!-- timer-core.js MUST load before focus.js -->
<script th:src="@{/js/timer-core.js}"></script>
<script th:src="@{/js/focus.js}"></script>
</body>
</html>
