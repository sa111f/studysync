<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Focus Mode — StudySync</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;600;700&display=swap" rel="stylesheet" />
    <link rel="stylesheet" th:href="@{/css/focus.css}" />
</head>
<body>

<!-- ── Minimal top bar ──────────────────────────────────────────── -->
<div class="focus-topbar">
    <a href="/" class="focus-back-btn">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor"
             stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <polyline points="15 18 9 12 15 6"/>
        </svg>
        Dashboard
    </a>
    <span class="focus-page-title">Focus Mode</span>
    <span class="focus-spacer" aria-hidden="true"></span>
</div>

<!-- ── Main focus area ──────────────────────────────────────────── -->
<main class="focus-main">

    <!-- Phase tabs -->
    <div class="focus-phase-tabs" role="tablist" aria-label="Timer phase">
        <button class="focus-tab active" id="ftab-pomodoro"
                role="tab" aria-selected="true"
                onclick="setPhase('pomodoro')">Pomodoro</button>
        <button class="focus-tab" id="ftab-shortbreak"
                role="tab" aria-selected="false"
                onclick="setPhase('shortbreak')">Short Break</button>
        <button class="focus-tab" id="ftab-longbreak"
                role="tab" aria-selected="false"
                onclick="setPhase('longbreak')">Long Break</button>
    </div>

    <!-- ══════════════════════════════════════════════════════════════
         FINJAN — Arabic qahwa cup, redrawn for correct proportions.

         Shape: wide flared rim (170 px) → gentle taper → narrower base.
         The cup is roughly as tall as it is wide (balanced, not lanky).
         Interior clip follows the inner ceramic wall ~14 px inside.

         Fill mechanism:
           #fj-fill-rect  y and height are updated each tick by focus.js.
           Full timer  → y=FINJAN_TOP (60), height=FINJAN_FILL_HEIGHT (140).
           Empty timer → y=200, height=0.  Liquid drains from the top.
           A gradient keeps the surface bright and the bottom deep.

         ViewBox 0 0 300 270  |  CSS height: 420 px
         FINJAN_TOP = 60       (top of interior clip, y=60)
         FINJAN_FILL_HEIGHT = 140  (y=60 → y=200)
         Click → fullscreen toggle (wired in focus.js)
         ══════════════════════════════════════════════════════════════ -->
    <div class="finjan-scene" id="finjan-scene">

        <svg id="finjan-svg"
             viewBox="0 0 300 270"
             xmlns="http://www.w3.org/2000/svg"
             role="button"
             tabindex="0"
             aria-label="Focus timer — click to toggle fullscreen">

            <defs>

                <!--
                    Interior wall clip path.
                    Follows the inner ceramic surface: 14 px inside
                    the outer body on each side.  Top y=60, bottom
                    Q-arc centre y=208.
                -->
                <clipPath id="fj-clip">
                    <path d="M 79,60  L 221,60
                             C 225,98  214,154 200,192
                             Q 150,208 100,192
                             C  86,154  75, 98  79, 60 Z"/>
                </clipPath>

                <!--
                    Liquid gradient — anchored to user-space y=60 (surface)
                    → y=200 (bottom).  Because the gradient is fixed to SVG
                    co-ordinates, the surface colour is always bright lavender
                    regardless of the current fill level.
                -->
                <linearGradient id="fj-fill-grad"
                                x1="0" y1="60" x2="0" y2="200"
                                gradientUnits="userSpaceOnUse">
                    <stop offset="0%"   stop-color="#e9d5ff" stop-opacity="0.98"/>
                    <stop offset="22%"  stop-color="#8b5cf6"/>
                    <stop offset="60%"  stop-color="#4c1d95"/>
                    <stop offset="100%" stop-color="#180a30"/>
                </linearGradient>

                <!--
                    Depth-glow radial — centred on the fill rect (objectBoundingBox)
                    so it stays centred on the liquid mass as it drains.
                -->
                <radialGradient id="fj-depth-glow" cx="50%" cy="45%" r="58%">
                    <stop offset="0%"   stop-color="#a78bfa" stop-opacity="0.38"/>
                    <stop offset="100%" stop-color="#6d28d9" stop-opacity="0"/>
                </radialGradient>

                <!--
                    Shimmer strip — a 14 px tall fade at the liquid surface.
                    objectBoundingBox → always at the top of the fill rect.
                -->
                <linearGradient id="fj-shimmer-grad" x1="0" y1="0" x2="0" y2="1">
                    <stop offset="0%"   stop-color="#ede9fe" stop-opacity="0.55"/>
                    <stop offset="100%" stop-color="#ede9fe" stop-opacity="0"/>
                </linearGradient>

            </defs>

            <!-- ── Ground shadow ── -->
            <ellipse cx="150" cy="262" rx="60" ry="5" fill="rgba(0,0,0,0.36)"/>

            <!--
                Outer cup body — the Arabic finjan silhouette.

                Dimensions:
                  Rim:  y=44,  x=65–235  (opening 170 px)
                  Base: y≈196, x=88–212  (base    124 px, 73% of opening)
                  Height to bottom arc: 218−44 = 174 px
                  Aspect: 170 × 174 — nearly square, characteristic of a finjan.

                Right side curve: C 240,88  226,152  212,196
                Bottom arc:       Q 150,218  88,196
                Left side mirror: C  74,152   60, 88  65, 44
            -->
            <path id="fj-body"
                  d="M 65,44 L 235,44
                     C 240,88  226,152 212,196
                     Q 150,218  88,196
                     C  74,152  60, 88  65, 44 Z"
                  fill="#0d0826"
                  stroke="rgba(124,92,252,0.32)"
                  stroke-width="1.8"/>

            <!-- ══ Interior — clipped to inner wall ══ -->
            <g clip-path="url(#fj-clip)">

                <!-- Dark empty-cup background -->
                <rect x="0" y="0" width="300" height="270" fill="#060414"/>

                <!-- Liquid fill — focus.js updates y + height each tick -->
                <rect id="fj-fill-rect" x="0" y="60" width="300" height="140"
                      fill="url(#fj-fill-grad)"/>

                <!-- Radial depth glow over the liquid -->
                <rect id="fj-depth-rect" x="0" y="60" width="300" height="140"
                      fill="url(#fj-depth-glow)"/>

                <!--
                    Surface shimmer strip — 14 px fade at the liquid top.
                    focus.js sets y to match fj-fill-rect.y.
                -->
                <rect id="fj-shimmer-rect" x="0" y="60" width="300" height="14"
                      fill="url(#fj-shimmer-grad)"/>

                <!-- Surface hairline — marks exact liquid level -->
                <line id="fj-surface" x1="0" y1="60" x2="300" y2="60"
                      stroke="#ddd6fe" stroke-width="1.4" opacity="0.55"/>

            </g>

            <!--
                Ceramic rim band — the thick lip between the outer rim (y=44)
                and the interior opening (y=60).  Gives a sense of wall depth.
            -->
            <path d="M 65,44 L 235,44 L 221,60 Q 150,65 79,60 Z"
                  fill="rgba(109,40,217,0.10)"
                  stroke="rgba(139,92,246,0.25)"
                  stroke-width="0.9"/>

            <!-- Rim top highlight line -->
            <line x1="65" y1="44" x2="235" y2="44"
                  stroke="#b4a0fb" stroke-width="1.8" opacity="0.5"
                  stroke-linecap="round"/>

            <!-- Small foot ring at the base — grounds the silhouette -->
            <ellipse cx="150" cy="215" rx="47" ry="5.5"
                     fill="#0d0826"
                     stroke="rgba(124,92,252,0.24)"
                     stroke-width="1.4"/>

            <!-- Subtle gloss on left inner wall — very faint -->
            <path d="M 83,66 C 81,100 80,148 82,184"
                  fill="none" stroke="rgba(255,255,255,0.045)"
                  stroke-width="10" stroke-linecap="round"/>

        </svg>

    </div><!-- /finjan-scene -->

    <!-- Timer countdown — sits directly below the cup -->
    <p class="finjan-time-display" id="finjan-time">25:00</p>

    <!-- Progress bar -->
    <div class="focus-bar-track" role="progressbar" aria-label="Session progress">
        <div class="focus-bar-fill" id="focus-bar-fill"></div>
    </div>

    <!-- Phase / session label -->
    <p class="focus-session-label" id="focus-session-label">Session 1 of 4</p>

    <!-- Controls -->
    <div class="focus-controls">
        <button class="focus-btn focus-btn-secondary" onclick="skipPhase()" title="Skip this phase">
            <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor"
                 stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                <polygon points="5 4 15 12 5 20 5 4"/>
                <line x1="19" y1="5" x2="19" y2="19"/>
            </svg>
            Skip
        </button>
        <button class="focus-btn focus-btn-primary" id="focus-toggle-btn" onclick="toggleTimer()">
            Start
        </button>
    </div>

    <!-- Keyboard hint -->
    <p class="focus-keyboard-hint">
        Press <kbd>Space</kbd> to pause&nbsp;/&nbsp;resume
    </p>

</main>

<!-- timer-core.js MUST load before focus.js -->
<script th:src="@{/js/timer-core.js}"></script>
<script th:src="@{/js/focus.js}"></script>
</body>
</html>
