<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Focus Mode — StudySync</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;600;700&display=swap" rel="stylesheet" />
    <link rel="stylesheet" th:href="@{/css/focus.css}" />
</head>
<body>

<!-- ── Minimal top bar ──────────────────────────────────────── -->
<div class="focus-topbar">
    <a href="/" class="focus-back-btn">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor"
             stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <polyline points="15 18 9 12 15 6"/>
        </svg>
        Dashboard
    </a>
    <span class="focus-page-title">Focus Mode</span>
    <span class="focus-spacer" aria-hidden="true"></span>
</div>

<!-- ── Main focus area ──────────────────────────────────────── -->
<main class="focus-main">

    <!-- Phase tabs -->
    <div class="focus-phase-tabs" role="tablist" aria-label="Timer phase">
        <button class="focus-tab active" id="ftab-pomodoro"
                role="tab" aria-selected="true"
                onclick="setPhase('pomodoro')">Pomodoro</button>
        <button class="focus-tab" id="ftab-shortbreak"
                role="tab" aria-selected="false"
                onclick="setPhase('shortbreak')">Short Break</button>
        <button class="focus-tab" id="ftab-longbreak"
                role="tab" aria-selected="false"
                onclick="setPhase('longbreak')">Long Break</button>
    </div>

    <!-- ══════════════════════════════════════════════════════
         FINJAN SCENE — redrawn Arabic qahwa cup
         Shape: wide flared rim → dramatic inward curve → narrow waist → rounded base
         Interior: pixel grid clipped to cup, generated + depleted by focus.js
         Exterior: thin gold (#d4a847) geometric lines only — no glow filters
         Timer text is the HTML element #finjan-time BELOW the SVG
         Click → fullscreen toggle
         ══════════════════════════════════════════════════════ -->
    <div class="finjan-scene" id="finjan-scene">

        <!--
            ViewBox 0 0 240 280  |  CSS height: 400 px → ~343 px wide
            FINJAN_TOP = 44        (top of interior clip, y=44)
            FINJAN_FILL_HEIGHT = 170  (interior y 44 → 214)
        -->
        <svg id="finjan-svg"
             viewBox="0 0 240 280"
             xmlns="http://www.w3.org/2000/svg"
             role="button"
             tabindex="0"
             aria-label="Focus timer — click to toggle fullscreen">
            <defs>
                <!--
                    Interior clip: follows the inner ceramic wall.
                    Wide at the rim opening, curves inward to a narrow waist,
                    gently rounds to the base.
                    Top y=44, bottom y=214.  FINJAN_FILL_HEIGHT = 170.
                -->
                <clipPath id="fj-clip">
                    <path d="M 52,44 L 188,44
                             C 188,90 163,128 155,148
                             C 151,174 151,198 150,214
                             Q 120,224 90,214
                             C 89,198 89,174 85,148
                             C 77,128 52,90 52,44 Z"/>
                </clipPath>
            </defs>

            <!-- ══ Ground shadow — subtle ellipse under the base ══ -->
            <ellipse cx="120" cy="272" rx="54" ry="5" fill="rgba(0,0,0,0.32)"/>

            <!-- ══ Cup outer ceramic body ══
                 Wide flared rim (y=18–40, x=38–202).
                 Curves steeply inward: waist at x≈82–158, y≈148.
                 Rounds gently to a small base and bottom arc. -->
            <path d="M 38,18 L 202,18 L 202,40
                     C 200,88 170,126 162,148
                     C 158,174 157,200 157,218
                     Q 120,230 83,218
                     C 83,200 82,174 78,148
                     C 70,126 40,88 38,40 Z"
                  fill="#17103a"
                  stroke="rgba(140,110,220,0.45)"
                  stroke-width="1.2"/>

            <!-- ══ Rim top edge — thin gold line across the opening ══ -->
            <line x1="38" y1="18" x2="202" y2="18"
                  stroke="#d4a847" stroke-width="1.5" stroke-linecap="round" opacity="0.75"/>

            <!-- Rim bottom edge — separates the lip from the body -->
            <line x1="41" y1="40" x2="199" y2="40"
                  stroke="#d4a847" stroke-width="0.9" stroke-linecap="round" opacity="0.5"/>

            <!-- ══ Interior pixel region (clipped to cup shape) ══ -->
            <g clip-path="url(#fj-clip)">
                <!-- Dark background fills the cup interior -->
                <rect x="0" y="0" width="240" height="280" fill="#0c0820"/>

                <!-- Pixel grid — populated by focus.js _generatePixels() -->
                <g id="finjan-pixels"/>

                <!--
                    Cover rect — opaque dark; anchored at y=FINJAN_TOP (44).
                    height=0 when timer is full; grows to 170 as time drains.
                    focus.js: height = Math.round((1−progress) × 170)
                -->
                <rect id="finjan-cover" x="0" y="44" width="240" height="0" fill="#0c0820"/>
            </g>

            <!-- ══ Exterior decoration — thin gold geometric lines only ══

                 Band 1 (upper body, y≈50–100):
                   Two border lines with a diamond-chain between them.
                   3 diamonds, centers at x=96,120,144, half-w=12, half-h=24.

                 Band 2 (mid body, y≈155–175):
                   Two horizontal lines with small V-chevrons between them.
            ══ -->

            <!-- Band 1: upper border line -->
            <line x1="44" y1="52" x2="196" y2="52"
                  stroke="#d4a847" stroke-width="1" opacity="0.6"/>

            <!-- Band 1: diamond chain
                 D1 centre x=96:  (84,76)-(96,52)-(108,76)-(96,100)
                 D2 centre x=120: (108,76)-(120,52)-(132,76)-(120,100)
                 D3 centre x=144: (132,76)-(144,52)-(156,76)-(144,100)
                 Diamonds share vertices horizontally. -->
            <polyline points="84,76 96,52 108,76 120,52 132,76 144,52 156,76"
                      fill="none" stroke="#d4a847" stroke-width="1.1"
                      stroke-linecap="round" stroke-linejoin="round" opacity="0.65"/>
            <polyline points="84,76 96,100 108,76 120,100 132,76 144,100 156,76"
                      fill="none" stroke="#d4a847" stroke-width="1.1"
                      stroke-linecap="round" stroke-linejoin="round" opacity="0.65"/>

            <!-- Band 1: lower border line -->
            <line x1="76" y1="100" x2="164" y2="100"
                  stroke="#d4a847" stroke-width="1" opacity="0.6"/>

            <!-- Band 2: upper border line (at the waist/lower body) -->
            <line x1="83" y1="156" x2="157" y2="156"
                  stroke="#d4a847" stroke-width="0.9" opacity="0.5"/>

            <!-- Band 2: three small V-chevrons -->
            <polyline points="91,156 99,168 107,156"
                      fill="none" stroke="#d4a847" stroke-width="1"
                      stroke-linecap="round" stroke-linejoin="round" opacity="0.55"/>
            <polyline points="112,156 120,168 128,156"
                      fill="none" stroke="#d4a847" stroke-width="1"
                      stroke-linecap="round" stroke-linejoin="round" opacity="0.55"/>
            <polyline points="133,156 141,168 149,156"
                      fill="none" stroke="#d4a847" stroke-width="1"
                      stroke-linecap="round" stroke-linejoin="round" opacity="0.55"/>

            <!-- Band 2: lower border line -->
            <line x1="83" y1="174" x2="157" y2="174"
                  stroke="#d4a847" stroke-width="0.9" opacity="0.5"/>

            <!-- Subtle gloss on the left wall (white, very faint) -->
            <path d="M 42,44 C 43,76 44,110 46,148 C 47,168 48,192 50,214"
                  fill="none" stroke="rgba(255,255,255,0.04)"
                  stroke-width="12" stroke-linecap="round"/>

        </svg><!-- /finjan-svg -->

    </div><!-- /finjan-scene -->

    <!-- Timer countdown — displayed below the cup, not inside it -->
    <p class="finjan-time-display" id="finjan-time">25:00</p>

    <!-- Progress bar -->
    <div class="focus-bar-track" role="progressbar" aria-label="Session progress">
        <div class="focus-bar-fill" id="focus-bar-fill"></div>
    </div>

    <!-- Phase / session label -->
    <p class="focus-session-label" id="focus-session-label">Session 1 of 4</p>

    <!-- Controls -->
    <div class="focus-controls">
        <button class="focus-btn focus-btn-secondary" onclick="skipPhase()" title="Skip this phase">
            <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor"
                 stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                <polygon points="5 4 15 12 5 20 5 4"/>
                <line x1="19" y1="5" x2="19" y2="19"/>
            </svg>
            Skip
        </button>
        <button class="focus-btn focus-btn-primary" id="focus-toggle-btn" onclick="toggleTimer()">
            Start
        </button>
    </div>

    <!-- Keyboard hint -->
    <p class="focus-keyboard-hint">
        Press <kbd>Space</kbd> to pause&nbsp;/&nbsp;resume
    </p>

</main>

<!-- timer-core.js MUST load before focus.js -->
<script th:src="@{/js/timer-core.js}"></script>
<script th:src="@{/js/focus.js}"></script>
</body>
</html>
