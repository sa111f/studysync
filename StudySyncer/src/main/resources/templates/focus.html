<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Focus Mode — StudySync</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;600;700&display=swap" rel="stylesheet" />
    <link rel="stylesheet" th:href="@{/css/focus.css}" />
</head>
<body>

<!-- ── Minimal top bar ──────────────────────────────────────── -->
<div class="focus-topbar">
    <a href="/" class="focus-back-btn">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor"
             stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <polyline points="15 18 9 12 15 6"/>
        </svg>
        Dashboard
    </a>
    <span class="focus-page-title">Focus Mode</span>
    <span class="focus-spacer" aria-hidden="true"></span>
</div>

<!-- ── Main focus area ──────────────────────────────────────── -->
<main class="focus-main">

    <!-- Phase tabs -->
    <div class="focus-phase-tabs" role="tablist" aria-label="Timer phase">
        <button class="focus-tab active" id="ftab-pomodoro"
                role="tab" aria-selected="true"
                onclick="setPhase('pomodoro')">Pomodoro</button>
        <button class="focus-tab" id="ftab-shortbreak"
                role="tab" aria-selected="false"
                onclick="setPhase('shortbreak')">Short Break</button>
        <button class="focus-tab" id="ftab-longbreak"
                role="tab" aria-selected="false"
                onclick="setPhase('longbreak')">Long Break</button>
    </div>

    <!-- ══════════════════════════════════════════════════════
         FLASK SCENE
         Structure:
           .flask-scene       — positioning context + CSS var --flask-glow
             .flask-glow-halo — ambient radial glow (dims as time drains)
             #flask-svg       — Erlenmeyer flask SVG
               <g clip-path>  — everything clipped to flask shape
                 bg rect      — dark flask interior
                 #flask-pixels — pixel grid (generated by focus.js)
                 #flask-cover  — dark cover rect; height = (1-progress)×244
               outline path   — glass edge with purple glow
               gloss / marks  — subtle glass highlight + tick marks
               #flask-time    — SVG <text> timer, centered in flask body
         ══════════════════════════════════════════════════════ -->
    <div class="flask-scene" id="flask-scene">

        <!-- Ambient radial glow behind the flask -->
        <div class="flask-glow-halo" aria-hidden="true"></div>

        <svg id="flask-svg"
             viewBox="0 0 200 285"
             width="200" height="285"
             xmlns="http://www.w3.org/2000/svg"
             role="img" aria-label="Focus energy level">
            <defs>
                <!-- Pixel glow: each pixel emits a soft purple halo -->
                <filter id="f-px-glow" x="-25%" y="-25%" width="150%" height="150%"
                        color-interpolation-filters="sRGB">
                    <feGaussianBlur in="SourceGraphic" stdDeviation="2.2" result="blur"/>
                    <feMerge>
                        <feMergeNode in="blur"/>
                        <feMergeNode in="SourceGraphic"/>
                    </feMerge>
                </filter>

                <!-- Flask outline glow -->
                <filter id="f-outline-glow" x="-8%" y="-3%" width="116%" height="106%"
                        color-interpolation-filters="sRGB">
                    <feGaussianBlur in="SourceGraphic" stdDeviation="3.5" result="blur"/>
                    <feMerge>
                        <feMergeNode in="blur"/>
                        <feMergeNode in="SourceGraphic"/>
                    </feMerge>
                </filter>

                <!-- Timer text glow -->
                <filter id="f-text-glow" x="-30%" y="-60%" width="160%" height="220%"
                        color-interpolation-filters="sRGB">
                    <feGaussianBlur in="SourceGraphic" stdDeviation="5" result="blur"/>
                    <feMerge>
                        <feMergeNode in="blur"/>
                        <feMergeNode in="SourceGraphic"/>
                    </feMerge>
                </filter>

                <!-- Flask clip — everything inside is cut to the flask shape -->
                <!--
                    Path trace (Erlenmeyer flask, viewBox 0 0 200 285):
                      Neck  : x 82–118, y 16–90   (36 px wide, 74 px tall)
                      Body  : curves out to ~144 px wide at y ≈ 195
                      Bottom: rounded, bottoms at y ≈ 260
                -->
                <clipPath id="c-flask">
                    <path d="M 82,16 L 118,16
                             L 118,90
                             C 138,102 160,140 172,195
                             Q 181,238 160,260
                             Q 100,274 40,260
                             Q 19,238 28,195
                             C 40,140 62,102 82,90
                             Z"/>
                </clipPath>
            </defs>

            <!-- ── Flask interior (all clipped to flask shape) ── -->
            <g clip-path="url(#c-flask)">
                <!-- Dark background fills the flask -->
                <rect x="0" y="0" width="200" height="285" fill="#0c0a1a"/>

                <!-- Pixel grid — generated by focus.js into this <g> -->
                <g id="flask-pixels" filter="url(#f-px-glow)"/>

                <!--
                    Cover rect — same color as background; covers pixels from top.
                    y is always FLASK_TOP (16). Only height changes.
                    height = 0 at 100% remaining → height = 244 at 0% remaining.
                    focus.js sets this via setAttribute('height', ...) on each tick.
                -->
                <rect id="flask-cover" x="0" y="16" width="200" height="0" fill="#0c0a1a"/>
            </g>

            <!-- ── Flask outline (drawn above pixels) ── -->
            <path d="M 82,16 L 118,16
                     L 118,90
                     C 138,102 160,140 172,195
                     Q 181,238 160,260
                     Q 100,274 40,260
                     Q 19,238 28,195
                     C 40,140 62,102 82,90
                     Z"
                  fill="none"
                  stroke="rgba(124,92,252,0.62)"
                  stroke-width="2"
                  filter="url(#f-outline-glow)"/>

            <!-- Neck rim (mouth of the flask) -->
            <line x1="78" y1="16" x2="122" y2="16"
                  stroke="rgba(124,92,252,0.75)"
                  stroke-width="3"
                  stroke-linecap="round"/>

            <!-- Glass gloss — subtle white highlight on left side -->
            <path d="M 85,24 Q 83,56 83,90 C 68,103 54,121 48,163"
                  fill="none"
                  stroke="rgba(255,255,255,0.09)"
                  stroke-width="3"
                  stroke-linecap="round"/>

            <!-- Measurement marks on right side of body -->
            <g opacity="0.32" stroke="#a78bfa" stroke-width="1.5" stroke-linecap="round">
                <line x1="153" y1="173" x2="162" y2="173"/>
                <line x1="157" y1="200" x2="167" y2="200"/>
                <line x1="157" y1="227" x2="167" y2="227"/>
            </g>

            <!-- Text backing — subtle dark circle for legibility -->
            <circle cx="100" cy="188" r="43" fill="rgba(6,4,16,0.55)"/>

            <!-- Timer text — SVG native; always above clipping -->
            <text id="flask-time"
                  x="100" y="188"
                  text-anchor="middle"
                  dominant-baseline="central"
                  font-family="'JetBrains Mono', monospace"
                  font-size="30"
                  font-weight="700"
                  fill="white"
                  filter="url(#f-text-glow)">25:00</text>

        </svg><!-- /flask-svg -->

    </div><!-- /flask-scene -->

    <!-- Progress bar -->
    <div class="focus-bar-track" role="progressbar" aria-label="Session progress">
        <div class="focus-bar-fill" id="focus-bar-fill"></div>
    </div>

    <!-- Phase / session label -->
    <p class="focus-session-label" id="focus-session-label">Session 1 of 4</p>

    <!-- Controls -->
    <div class="focus-controls">
        <button class="focus-btn focus-btn-secondary" onclick="skipPhase()" title="Skip this phase">
            <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor"
                 stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                <polygon points="5 4 15 12 5 20 5 4"/>
                <line x1="19" y1="5" x2="19" y2="19"/>
            </svg>
            Skip
        </button>
        <button class="focus-btn focus-btn-primary" id="focus-toggle-btn" onclick="toggleTimer()">
            Start
        </button>
    </div>

    <!-- Keyboard hint -->
    <p class="focus-keyboard-hint">
        Press <kbd>Space</kbd> to pause&nbsp;/&nbsp;resume
    </p>

</main>

<!-- timer-core.js MUST load before focus.js -->
<script th:src="@{/js/timer-core.js}"></script>
<script th:src="@{/js/focus.js}"></script>
</body>
</html>
