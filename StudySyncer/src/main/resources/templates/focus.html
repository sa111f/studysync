<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Focus Mode — StudySync</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;600;700&display=swap" rel="stylesheet" />
    <link rel="stylesheet" th:href="@{/css/focus.css}" />
</head>
<body>

<!-- ── Minimal top bar ──────────────────────────────────────── -->
<div class="focus-topbar">
    <a href="/" class="focus-back-btn">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor"
             stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <polyline points="15 18 9 12 15 6"/>
        </svg>
        Dashboard
    </a>
    <span class="focus-page-title">Focus Mode</span>
    <span class="focus-spacer" aria-hidden="true"></span>
</div>

<!-- ── Main focus area ──────────────────────────────────────── -->
<main class="focus-main">

    <!-- Phase tabs -->
    <div class="focus-phase-tabs" role="tablist" aria-label="Timer phase">
        <button class="focus-tab active" id="ftab-pomodoro"
                role="tab" aria-selected="true"
                onclick="setPhase('pomodoro')">Pomodoro</button>
        <button class="focus-tab" id="ftab-shortbreak"
                role="tab" aria-selected="false"
                onclick="setPhase('shortbreak')">Short Break</button>
        <button class="focus-tab" id="ftab-longbreak"
                role="tab" aria-selected="false"
                onclick="setPhase('longbreak')">Long Break</button>
    </div>

    <!-- ══════════════════════════════════════════════════════
         FINJAN SCENE
         Arabic coffee cup (finjan) — the visual centrepiece.
         Click to toggle fullscreen. Coffee level drains as time runs.
           .finjan-scene      — positioning context + CSS var --flask-glow
             .finjan-glow-halo — ambient radial glow
             #finjan-svg       — Arabic finjan SVG
               <g clip-path>   — interior (coffee + cover rect)
               decorations     — gold bands, geometric patterns, green accents
               #finjan-time    — SVG <text> timer, centered in lower cup body
         ══════════════════════════════════════════════════════ -->
    <div class="finjan-scene" id="finjan-scene">

        <!-- Ambient radial glow behind the cup -->
        <div class="finjan-glow-halo" aria-hidden="true"></div>

        <!--
            Click → toggle fullscreen.
            viewBox 0 0 200 290  |  rendered ≈ 207 × 300 px via CSS.
            FINJAN_TOP = 65, FINJAN_FILL_HEIGHT = 172  (interior y 65–237).
        -->
        <svg id="finjan-svg"
             viewBox="0 0 200 290"
             xmlns="http://www.w3.org/2000/svg"
             role="button"
             tabindex="0"
             aria-label="Focus timer — click to toggle fullscreen">
            <defs>
                <!-- Outer body glow -->
                <filter id="fj-glow" x="-18%" y="-8%" width="136%" height="116%"
                        color-interpolation-filters="sRGB">
                    <feGaussianBlur in="SourceGraphic" stdDeviation="3.8" result="b"/>
                    <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
                </filter>
                <!-- Gold detail glow -->
                <filter id="fj-gold" x="-12%" y="-30%" width="124%" height="160%"
                        color-interpolation-filters="sRGB">
                    <feGaussianBlur in="SourceGraphic" stdDeviation="1.6" result="b"/>
                    <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
                </filter>
                <!-- Timer text glow -->
                <filter id="fj-txt" x="-22%" y="-55%" width="144%" height="210%"
                        color-interpolation-filters="sRGB">
                    <feGaussianBlur in="SourceGraphic" stdDeviation="5" result="b"/>
                    <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
                </filter>

                <!-- Cup interior clip path -->
                <clipPath id="fj-clip">
                    <path d="M 44,65 C 44,71 47,73 50,76 L 52,237
                             Q 100,247 148,237 L 150,76
                             C 153,73 156,71 156,65 Z"/>
                </clipPath>

                <!-- Ceramic body gradient: deep indigo / violet -->
                <linearGradient id="fj-body" x1="0%" y1="0%" x2="100%" y2="0%">
                    <stop offset="0%"   stop-color="#110a2c"/>
                    <stop offset="18%"  stop-color="#1c1452"/>
                    <stop offset="50%"  stop-color="#231a64"/>
                    <stop offset="82%"  stop-color="#1c1452"/>
                    <stop offset="100%" stop-color="#110a2c"/>
                </linearGradient>

                <!-- Rim gradient: slightly lighter indigo -->
                <linearGradient id="fj-rim" x1="0%" y1="0%" x2="100%" y2="0%">
                    <stop offset="0%"   stop-color="#1a1248"/>
                    <stop offset="50%"  stop-color="#2b2076"/>
                    <stop offset="100%" stop-color="#1a1248"/>
                </linearGradient>

                <!-- Coffee interior: rich warm brown -->
                <linearGradient id="fj-coffee" x1="0%" y1="0%" x2="0%" y2="100%">
                    <stop offset="0%"   stop-color="#3e2208"/>
                    <stop offset="45%"  stop-color="#2c1a06"/>
                    <stop offset="100%" stop-color="#1a0e04"/>
                </linearGradient>

                <!-- Saucer gradient -->
                <linearGradient id="fj-saucer" x1="0%" y1="0%" x2="100%" y2="0%">
                    <stop offset="0%"   stop-color="#130d38"/>
                    <stop offset="50%"  stop-color="#1f186a"/>
                    <stop offset="100%" stop-color="#130d38"/>
                </linearGradient>
            </defs>

            <!-- ── Drop shadow under saucer ── -->
            <ellipse cx="100" cy="274" rx="76" ry="6" fill="rgba(0,0,0,0.5)"/>

            <!-- ── Saucer ── -->
            <ellipse cx="100" cy="268" rx="72" ry="9"
                     fill="url(#fj-saucer)"
                     stroke="rgba(124,92,252,0.45)" stroke-width="1.2"/>
            <ellipse cx="100" cy="265" rx="60" ry="6" fill="none"
                     stroke="rgba(255,215,0,0.32)" stroke-width="1"/>
            <!-- Cup ring indent -->
            <ellipse cx="100" cy="264" rx="33" ry="3" fill="rgba(0,0,0,0.3)"/>

            <!-- ── Cup outer body ── -->
            <path d="M 28,50 Q 28,42 38,42 L 162,42 Q 172,42 172,50
                     L 170,65 C 162,69 158,72 156,78 L 150,242
                     Q 126,252 74,252 Q 50,252 50,242
                     L 44,78 C 42,72 38,69 30,65 Z"
                  fill="url(#fj-body)"
                  stroke="rgba(124,92,252,0.62)"
                  stroke-width="1.5"
                  filter="url(#fj-glow)"/>

            <!-- Rim cap (overhang, lighter fill) -->
            <path d="M 28,50 Q 28,42 38,42 L 162,42 Q 172,42 172,50
                     L 170,65 C 162,69 158,72 156,78
                     L 44,78 C 42,72 38,69 30,65 Z"
                  fill="url(#fj-rim)"/>

            <!-- Gold top rim edges -->
            <path d="M 38,42 L 162,42 Q 172,42 172,50 L 170,65"
                  fill="none" stroke="rgba(255,215,0,0.82)" stroke-width="2"
                  stroke-linecap="round" filter="url(#fj-gold)"/>
            <path d="M 38,42 Q 28,42 28,50 L 30,65"
                  fill="none" stroke="rgba(255,215,0,0.82)" stroke-width="2"
                  stroke-linecap="round" filter="url(#fj-gold)"/>
            <!-- Rim / body dividing line -->
            <line x1="44" y1="78" x2="156" y2="78"
                  stroke="rgba(255,215,0,0.6)" stroke-width="1.3"
                  filter="url(#fj-gold)"/>

            <!-- ══ Cup interior (coffee + drain cover) ══ -->
            <g clip-path="url(#fj-clip)">
                <!-- Dark ceramic interior base -->
                <rect x="0" y="0" width="200" height="290" fill="#0c0820"/>
                <!-- Coffee warm fill -->
                <rect x="0" y="65" width="200" height="172" fill="url(#fj-coffee)"/>
                <!--
                    Cover rect — same dark colour as interior; grows from top as time drains.
                    y is always FINJAN_TOP (65). Only height changes.
                    focus.js: height = Math.round((1−progress) × 172)
                -->
                <rect id="finjan-cover" x="0" y="65" width="200" height="0" fill="#0c0820"/>
            </g>

            <!-- Open cup top — dark coffee surface visible at rim opening -->
            <ellipse cx="100" cy="67" rx="56" ry="8.5" fill="rgba(38,20,7,0.75)"/>
            <!-- Subtle coffee sheen -->
            <ellipse cx="89" cy="63" rx="15" ry="3" fill="rgba(200,140,40,0.07)"/>

            <!-- ══ Upper gold decorative border ══ -->
            <line x1="46" y1="94" x2="154" y2="94"
                  stroke="rgba(255,215,0,0.8)" stroke-width="1.4"
                  filter="url(#fj-gold)"/>
            <!-- Dot chain on upper border -->
            <g fill="rgba(255,215,0,0.7)" filter="url(#fj-gold)">
                <circle cx="55"  cy="94" r="1.8"/>
                <circle cx="69"  cy="94" r="1.8"/>
                <circle cx="83"  cy="94" r="1.8"/>
                <circle cx="100" cy="94" r="2.2"/>
                <circle cx="117" cy="94" r="1.8"/>
                <circle cx="131" cy="94" r="1.8"/>
                <circle cx="145" cy="94" r="1.8"/>
            </g>
            <!-- Subtle chevron accent above band -->
            <path d="M 46,87 L 55,90 L 64,87 L 73,90 L 82,87 L 91,90 L 100,87
                     L 109,90 L 118,87 L 127,90 L 136,87 L 145,90 L 154,87"
                  fill="none" stroke="rgba(255,215,0,0.28)" stroke-width="0.9"
                  stroke-linecap="round" stroke-linejoin="round"/>

            <!-- ══ Geometric pattern band (y ≈ 94–168) ══ -->

            <!-- Central diamond -->
            <polygon points="100,106 112,128 100,150 88,128"
                     fill="none" stroke="rgba(255,215,0,0.74)" stroke-width="1.3"
                     filter="url(#fj-gold)"/>
            <!-- 4-petal rosette inside centre diamond -->
            <ellipse cx="100" cy="121" rx="3.2" ry="5"   fill="rgba(167,139,250,0.52)"/>
            <ellipse cx="100" cy="135" rx="3.2" ry="5"   fill="rgba(167,139,250,0.52)"/>
            <ellipse cx="93"  cy="128" rx="5"   ry="3.2" fill="rgba(167,139,250,0.52)"/>
            <ellipse cx="107" cy="128" rx="5"   ry="3.2" fill="rgba(167,139,250,0.52)"/>
            <!-- Centre dot -->
            <circle cx="100" cy="128" r="3.2" fill="rgba(255,215,0,0.84)"
                    filter="url(#fj-gold)"/>

            <!-- Left diamond -->
            <polygon points="67,109 77,128 67,147 57,128"
                     fill="none" stroke="rgba(255,215,0,0.54)" stroke-width="1.1"/>
            <circle cx="67" cy="128" r="2.3" fill="rgba(255,215,0,0.62)"/>

            <!-- Right diamond -->
            <polygon points="133,109 143,128 133,147 123,128"
                     fill="none" stroke="rgba(255,215,0,0.54)" stroke-width="1.1"/>
            <circle cx="133" cy="128" r="2.3" fill="rgba(255,215,0,0.62)"/>

            <!-- Green accent orbs flanking centre -->
            <circle cx="85"  cy="128" r="3.2" fill="rgba(74,222,128,0.7)"
                    filter="url(#fj-gold)"/>
            <circle cx="115" cy="128" r="3.2" fill="rgba(74,222,128,0.7)"
                    filter="url(#fj-gold)"/>
            <!-- Outer green dots -->
            <circle cx="50"  cy="128" r="2.0" fill="rgba(74,222,128,0.42)"/>
            <circle cx="150" cy="128" r="2.0" fill="rgba(74,222,128,0.42)"/>

            <!-- 8-point mini-stars between diamonds -->
            <g stroke="rgba(255,215,0,0.58)" stroke-width="0.9" stroke-linecap="round">
                <!-- Left edge -->
                <line x1="50" y1="122" x2="50" y2="118"/>
                <line x1="48" y1="120" x2="52" y2="120"/>
                <!-- Left ↔ Centre -->
                <line x1="85" y1="112" x2="85" y2="116"/>
                <line x1="83" y1="114" x2="87" y2="114"/>
                <line x1="83.5" y1="112.5" x2="86.5" y2="115.5"/>
                <line x1="86.5" y1="112.5" x2="83.5" y2="115.5"/>
                <!-- Centre ↔ Right -->
                <line x1="115" y1="112" x2="115" y2="116"/>
                <line x1="113" y1="114" x2="117" y2="114"/>
                <line x1="113.5" y1="112.5" x2="116.5" y2="115.5"/>
                <line x1="116.5" y1="112.5" x2="113.5" y2="115.5"/>
                <!-- Right edge -->
                <line x1="150" y1="122" x2="150" y2="118"/>
                <line x1="148" y1="120" x2="152" y2="120"/>
            </g>

            <!-- ══ Lower gold decorative border ══ -->
            <line x1="46" y1="168" x2="154" y2="168"
                  stroke="rgba(255,215,0,0.8)" stroke-width="1.4"
                  filter="url(#fj-gold)"/>
            <!-- Dot chain on lower border -->
            <g fill="rgba(255,215,0,0.7)" filter="url(#fj-gold)">
                <circle cx="55"  cy="168" r="1.8"/>
                <circle cx="69"  cy="168" r="1.8"/>
                <circle cx="83"  cy="168" r="1.8"/>
                <circle cx="100" cy="168" r="2.2"/>
                <circle cx="117" cy="168" r="1.8"/>
                <circle cx="131" cy="168" r="1.8"/>
                <circle cx="145" cy="168" r="1.8"/>
            </g>
            <!-- Chevron accent below lower band -->
            <path d="M 46,175 L 55,178 L 64,175 L 73,178 L 82,175 L 91,178 L 100,175
                     L 109,178 L 118,175 L 127,178 L 136,175 L 145,178 L 154,175"
                  fill="none" stroke="rgba(255,215,0,0.24)" stroke-width="0.9"
                  stroke-linecap="round" stroke-linejoin="round"/>

            <!-- ── Gloss highlight on left cup wall ── -->
            <path d="M 37,74 Q 37,96 38,120 L 40,185 Q 41,210 43,228"
                  fill="none"
                  stroke="rgba(255,255,255,0.055)"
                  stroke-width="10"
                  stroke-linecap="round"/>

            <!-- ── Timer text — lower cup body, below decorative band ── -->
            <ellipse cx="100" cy="210" rx="48" ry="22" fill="rgba(0,0,0,0.38)"/>
            <text id="finjan-time"
                  x="100" y="210"
                  text-anchor="middle"
                  dominant-baseline="central"
                  font-family="'JetBrains Mono', monospace"
                  font-size="28"
                  font-weight="700"
                  fill="white"
                  filter="url(#fj-txt)">25:00</text>

        </svg><!-- /finjan-svg -->

    </div><!-- /finjan-scene -->

    <!-- Progress bar -->
    <div class="focus-bar-track" role="progressbar" aria-label="Session progress">
        <div class="focus-bar-fill" id="focus-bar-fill"></div>
    </div>

    <!-- Phase / session label -->
    <p class="focus-session-label" id="focus-session-label">Session 1 of 4</p>

    <!-- Controls -->
    <div class="focus-controls">
        <button class="focus-btn focus-btn-secondary" onclick="skipPhase()" title="Skip this phase">
            <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor"
                 stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                <polygon points="5 4 15 12 5 20 5 4"/>
                <line x1="19" y1="5" x2="19" y2="19"/>
            </svg>
            Skip
        </button>
        <button class="focus-btn focus-btn-primary" id="focus-toggle-btn" onclick="toggleTimer()">
            Start
        </button>
    </div>

    <!-- Keyboard hint -->
    <p class="focus-keyboard-hint">
        Press <kbd>Space</kbd> to pause&nbsp;/&nbsp;resume
    </p>

</main>

<!-- timer-core.js MUST load before focus.js -->
<script th:src="@{/js/timer-core.js}"></script>
<script th:src="@{/js/focus.js}"></script>
</body>
</html>
