# ── H2 in-memory database (PostgreSQL compatibility mode) ─────────────────────
# MODE=PostgreSQL makes H2 accept PostgreSQL DDL syntax including:
#   ALTER TABLE t ALTER COLUMN c SET DEFAULT v
#   ALTER TABLE t ALTER COLUMN c SET NOT NULL
# DB_CLOSE_DELAY=-1 keeps the in-memory DB alive for the JVM lifetime so the
# Spring context cache can share one DB across all tests in a test run.
spring.datasource.url=jdbc:h2:mem:studysyncer_test;DB_CLOSE_DELAY=-1;MODE=PostgreSQL;NON_KEYWORDS=VALUE
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
# create-drop: schema is freshly built for each test run; tests must clean up rows manually.
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=false

# ── Disable external services ──────────────────────��──────────────────────────
# Resend email — blank key means EmailService.isConfigured() returns false and
# no email is ever sent during tests.
resend.api-key=
resend.from-email=
resend.alert-to-email=

# Twilio — dummy values; SmsService checks for blank and returns false.
twilio.account-sid=ACtest00000000000000000000000000000
twilio.auth-token=test_token_placeholder
twilio.phone-number=+10000000000

# OpenAI — blank key; AI endpoints simply fail gracefully in tests.
studysyncer.ai.api-key=

# Scheduler — impossible cron (Feb 29) so no scheduled jobs fire during tests.
studysyncer.notification.cron=0 0 0 29 2 ?
studysyncer.notification.timezone=America/Toronto

# Google OAuth — dummy values; GoogleOAuthConfig handles empty IDs gracefully.
spring.security.oauth2.client.registration.google.client-id=test-client-id
spring.security.oauth2.client.registration.google.client-secret=test-client-secret
spring.security.oauth2.client.registration.google.redirect-uri=http://localhost/login/oauth2/code/google
